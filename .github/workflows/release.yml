name: Release

# Push a tag such as v0.1.0 to build the zip and publish a GitHub release.
# The tag must match MARKETING_VERSION (v0.1.0 ↔ 0.1.0).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build release zip
        run: scripts/release.sh

      - name: Check tag matches app version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/rexTrackpad-${VERSION}.zip" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION:"
            ls dist
            exit 1
          fi

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # This version's section of CHANGELOG.md, followed by the install notes.
          awk -v heading="## ${VERSION} " 'index($0, heading) == 1 { found = 1; next }
               found && /^## / { exit }
               found { print }' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          printf '\n' >> dist/notes.md
          cat .github/release-notes.md >> dist/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "rexTrackpad ${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md
